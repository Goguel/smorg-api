[tools]
java = "21"
go = "1.23.0"

[tasks]
build = "cd api && ./gradlew build -x test && cd ../services && go build ./..."
test = "cd api && ./gradlew test && cd ../services && go test ./..."
up = "docker compose up -d"
"up:build" = "docker compose up --build -d"
down = "docker compose down"
ci = "mise run build && mise run test"
"buf:lint" = "cd protos && buf lint"
"buf:generate" = "cd protos && buf generate"
"prazos:run" = "cd services && go run ./cmd/prazos"
"prazos:test" = "cd services && go test -v ./..."
"api:run" = "cd api && ./gradlew run"
"api:test" = "cd api && ./gradlew test"
