services:
  postgres:
    image: postgres:16-alpine
    container_name: smorg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smorg
      POSTGRES_USER: smorg
      POSTGRES_PASSWORD: smorg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smorg -d smorg"]
      interval: 3s
      timeout: 5s
      retries: 10

  servico-prazos:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: smorg-servico-prazos
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      PRAZOS_PORTA: "50051"
    healthcheck:
      test: ["CMD", "/prazos", "saude"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smorg-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      POSTGRES_JDBC_URL: "jdbc:postgresql://postgres:5432/smorg"
      POSTGRES_USER: "smorg"
      POSTGRES_PASSWORD: "smorg"
      STORAGE_JDBCURL: "jdbc:postgresql://postgres:5432/smorg"
      STORAGE_USER: "smorg"
      STORAGE_PASSWORD: "smorg"
      PRAZOS_GRPC_HOST: "servico-prazos:50051"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      servico-prazos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
