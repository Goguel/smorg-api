ktor:
  deployment:
    port: ${PORT:8080}
    host: ${HOST:0.0.0.0}
  application:
    modules:
      - com.smorg.plugins.DatabaseKt.configureDatabases
      - com.smorg.HttpKt.configureHttp
      - com.smorg.RoutingKt.configureRouting

storage:
  jdbcURL: ${POSTGRES_JDBC_URL:${STORAGE_JDBCURL:jdbc:postgresql://localhost:5432/smorg}}
  user: ${POSTGRES_USER:${STORAGE_USER:smorg}}
  password: ${POSTGRES_PASSWORD:${STORAGE_PASSWORD:smorg}}
